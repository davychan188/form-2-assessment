<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b4332">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Form 2">
  <title>Form 2 Assessment</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <svg class="brand" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="96" fill="#1b4332"/>
        <rect x="40" y="40" width="432" height="432" rx="64" fill="none" stroke="#95d5b2" stroke-width="14"/>
        <text x="140" y="340" font-family="Arial, Helvetica, sans-serif" font-size="220" font-weight="700" fill="#d8f3dc">F</text>
        <text x="280" y="340" font-family="Arial, Helvetica, sans-serif" font-size="220" font-weight="700" fill="#52b788">2</text>
      </svg>
      <h1 data-i18n="app">Form 2 Assessment</h1>
      <button class="lang-toggle" id="langBtn" type="button">中文</button>
    </header>

    <!-- HOME -->
    <section class="screen active" id="screen-home">
      <div class="card">
        <h2 data-i18n="inspections">Inspections</h2>
        <button class="btn" id="btnNew" type="button" data-i18n="newTree">New tree inspection</button>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn secondary" id="btnSelectAll" type="button">Select all</button>
          <button class="btn secondary" id="btnSort" type="button">排序</button>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn secondary" id="btnExportSelected" type="button">Export JSON</button>
          <button class="btn secondary" id="btnExportWord" type="button">Export Word</button>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn danger" id="btnDeleteSelected" type="button">Delete selected</button>
          <button class="btn secondary" id="btnImport" type="button">Import JSON</button>
        </div>
        <input class="hidden-file" id="fileImport" type="file" accept="application/json,.json" multiple>
      </div>
      <div class="list" id="inspectionList"></div>
    </section>

    <!-- TREE -->
    <section class="screen" id="screen-tree">
      <div class="btn-row" style="margin-bottom:12px">
        <button class="btn secondary" id="btnBackHome" type="button" data-i18n="back">Back</button>
        <button class="btn secondary" id="btnSaveTree" type="button" data-i18n="saveTree">Save tree & continue</button>
      </div>
      <div class="card">
        <h2 data-i18n="treeInfo">Tree information</h2>
        <div class="field">
          <label data-i18n="treeId">Tree ID / tag</label>
          <input id="f-treeId" autocomplete="off">
        </div>
        <div class="field species-field">
          <label data-i18n="species">Species</label>
          <input id="f-species" autocomplete="off" data-i18n-placeholder="speciesSearch">
          <div class="suggest" id="speciesSuggest" hidden></div>
        </div>
        <div class="field">
          <div class="row spread" style="align-items:center;margin-bottom:4px">
            <label data-i18n="site" style="margin:0">Site / location</label>
            <button class="btn secondary" type="button" data-chip-toggle="siteChips" style="width:auto;min-height:32px;padding:4px 10px;font-size:13px">Show options</button>
          </div>
          <input id="f-site" autocomplete="off" placeholder="or type your own">
          <div class="chip-box" id="siteChips" hidden></div>
        </div>
        <div class="field">
          <div class="row spread" style="align-items:center;margin-bottom:4px">
            <label data-i18n="nearby" style="margin:0">Nearby environment (附近環境)</label>
            <button class="btn secondary" type="button" data-chip-toggle="nearbyChips" style="width:auto;min-height:32px;padding:4px 10px;font-size:13px">Show options</button>
          </div>
          <input id="f-nearby" autocomplete="off" placeholder="or type your own">
          <div class="chip-box" id="nearbyChips" hidden></div>
        </div>
        <div class="field">
          <div class="row spread" style="align-items:center;margin-bottom:4px">
            <label data-i18n="targets" style="margin:0">Targets (目標)</label>
            <button class="btn secondary" type="button" data-chip-toggle="targetsChips" style="width:auto;min-height:32px;padding:4px 10px;font-size:13px">Show options</button>
          </div>
          <input id="f-targets" autocomplete="off" placeholder="or type your own">
          <div class="chip-box" id="targetsChips" hidden></div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label data-i18n="inspector">Inspector</label>
            <input id="f-inspector" autocomplete="name">
          </div>
          <div class="field">
            <label data-i18n="date">Date</label>
            <input id="f-date" type="date">
          </div>
        </div>
        <div class="field">
          <div class="row spread" style="align-items:center;margin-bottom:4px">
            <label style="margin:0">Recommendation</label>
            <button class="btn secondary" type="button" data-chip-toggle="recChips" style="width:auto;min-height:32px;padding:4px 10px;font-size:13px">Show options</button>
          </div>
          <input id="f-recommendation" autocomplete="off" placeholder="or type your own">
          <div class="chip-box" id="recChips" hidden></div>
        </div>
          <textarea id="f-notes"></textarea>
        </div>
        <div class="field">
          <div class="row spread" style="align-items:center;margin-bottom:6px">
            <label data-i18n="comments" style="margin:0">Assessment comments</label>
            <button class="btn secondary" id="btnRefreshComments" type="button" style="width:auto;min-height:36px;padding:6px 10px;font-size:13px">Refresh from fields</button>
          </div>
          <textarea id="f-comments" rows="8" style="min-height:140px"></textarea>
          <p class="help" style="margin-top:6px">“1” = site, “2” = nearby, “3” = targets. You can edit freely before export.</p>
        </div>
        <div class="row spread" style="margin-bottom:10px">
          <span class="status-pill" id="gpsLabel">No GPS yet</span>
          <button class="btn secondary" id="btnGps" type="button" style="width:auto;min-height:42px;padding:8px 12px" data-i18n="gps">Capture GPS</button>
        </div>
        <div class="row spread" style="align-items:center;margin-bottom:6px">
          <h3 data-i18n="treePhotos" style="margin:0">Tree photos (at least 1)</h3>
          <button class="btn secondary" id="btnToggleCaptionOptions" type="button" style="width:auto;min-height:32px;padding:4px 10px;font-size:13px">Show options</button>
        </div>
        <div class="photos" id="treePhotos"></div>
        <input class="hidden-file" id="fileTreePhoto" type="file" accept="image/*" capture="environment">
        <button class="btn ghost" id="btnTreePhoto" type="button" style="margin-top:10px" data-i18n="addTreePhoto">Take / add tree photo</button>
        <button class="btn secondary" type="button" style="margin-top:8px" data-stamp-toggle>Date/time stamp: OFF</button>
      </div>

      <div class="btn-row">
        <button class="btn secondary" id="btnJson" type="button" data-i18n="exportJson">Backup JSON</button>
        <button class="btn" id="btnExport" type="button" data-i18n="export">Export report</button>
      </div>
      <button class="btn danger" id="btnDeleteTree" type="button" style="margin-top:10px" data-i18n="delete">Delete</button>
    </section>
  </div>

  <div class="photo-editor" id="photoEditor" hidden>
    <div class="pe-toolbar">
      <span class="pe-title" data-i18n="markPhoto">Mark photo</span>
      <button class="btn secondary" type="button" id="peCancel" data-i18n="cancel">Cancel</button>
      <button class="btn" type="button" id="peSave" data-i18n="saveMarks">Save</button>
    </div>
    <div class="pe-stage" id="peStage">
      <canvas id="peCanvas"></canvas>
    </div>
    <div class="pe-tools">
      <button class="tool active" type="button" data-pe-tool="arrow" data-i18n="toolArrow">Arrow</button>
      <button class="tool" type="button" data-pe-tool="circle" data-i18n="toolCircle">Circle</button>
      <button class="tool" type="button" data-pe-tool="dash" data-i18n="toolDash">Dashed line</button>
      <div class="pe-colors" id="peColors"></div>
      <div class="pe-widths">
        <button class="tool" type="button" data-pe-width="thin" data-i18n="strokeThin">Thin</button>
        <button class="tool active" type="button" data-pe-width="medium" data-i18n="strokeMedium">Medium</button>
        <button class="tool" type="button" data-pe-width="thick" data-i18n="strokeThick">Thick</button>
      </div>
      <span class="pe-hint" data-i18n="markHint">Drag on the photo to draw</span>
    </div>
    <div class="pe-footer">
      <button class="btn secondary" type="button" id="peUndo" data-i18n="undoMark">Undo</button>
      <button class="btn secondary" type="button" id="peClear" data-i18n="clearMarks">Clear marks</button>
      <button class="btn secondary" type="button" id="peRotate" data-i18n="rotatePhoto">Rotate 90°</button>
      <button class="btn danger" type="button" id="peDelete" data-i18n="delete">Delete</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="./jszip.min.js"></script>
  <script src="./template-b64.js"></script>
  <script src="./export-docx.js"></script>
  <script src="./species-list.js"></script>
  <script src="./app.js"></script>
</body>
</html>
